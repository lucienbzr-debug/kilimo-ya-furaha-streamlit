[theme]
base = "light"
primaryColor = "#1d5e43"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6f4"
textColor = "#1b221e"
borderColor = "#d9dfda"
greenColor = "#1d5e43"
orangeColor = "#b86e14"
redColor = "#c0392b"
chartCategoricalColors = ["#1d5e43", "#d9892b", "#2a78d6", "#1baf7a", "#e87ba4", "#4a3aa7", "#e34948", "#b9c1bb"]

[theme.sidebar]
backgroundColor = "#eef3f0"

[server]
headless = true
# Hébergement derrière un proxy (Posit Connect Cloud) : l'application est servie dans une iframe
# d'un autre domaine. Sans ces deux réglages, le navigateur charge la page mais la connexion
# WebSocket (/_stcore/stream) est refusée et l'écran reste blanc. Sans risque ici : l'application
# est en lecture seule, sans authentification ni téléversement de fichiers.
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
